<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Duoscribe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="sidebar"></div>
  <div id="main-column">
    <div id="toolbar">
      <div id="tabbar"></div>
      <button id="outline-toggle" title="Toggle outline (Cmd/Ctrl+Shift+O)">☰</button>
      <button id="theme-toggle" title="Toggle theme (system)">◐</button>
    </div>
    <div id="drop-hint">Drag .md files here, or File &gt; Open</div>
    <div id="panes">
      <div id="source-container">
        <textarea id="source" spellcheck="false" placeholder="Open or drop a markdown file to begin..."></textarea>
        <div id="findbar" class="hidden">
          <div class="findbar-group">
            <input id="find-input" type="text" placeholder="Find..." />
            <button id="find-prev-btn" title="Previous match (Shift+Enter)">↑</button>
            <button id="find-next-btn" title="Next match (Enter)">↓</button>
            <span id="find-counter" class="findbar-counter">0/0</span>
          </div>
          <div class="findbar-group">
            <input id="replace-input" type="text" placeholder="Replace..." />
            <button id="replace-btn" title="Replace current match">Replace</button>
            <button id="replace-all-btn" title="Replace all matches">Replace All</button>
          </div>
          <button id="findbar-close-btn" class="findbar-close" title="Close (Esc)">×</button>
        </div>
      </div>
      <div id="split-handle" title="Drag to resize"></div>
      <div id="preview"></div>
      <div id="outline-panel"></div>
    </div>
    <div id="statusbar"></div>
  </div>
  <div id="command-palette-overlay" class="hidden">
    <div id="command-palette">
      <input id="command-palette-input" type="text" placeholder="Type a command..." autocomplete="off" spellcheck="false" />
      <div id="command-palette-list"></div>
    </div>
  </div>
  <script src="vendor/mermaid.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
