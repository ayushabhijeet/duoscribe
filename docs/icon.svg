    <text x="130" y="360">#</text>
    <text x="130" y="480">**</text>
    <text x="130" y="600">-</text>
    <text x="130" y="720">&gt;</text>
  </g>

  <!-- right: rendered result -->
  <g>
    <rect x="600" y="320" width="290" height="46" rx="10" fill="#e8eaee"/>
    <rect x="600" y="410" width="230" height="34" rx="8" fill="#e8eaee"/>
    <circle cx="622" cy="520" r="10" fill="#e8eaee"/>
    <rect x="650" y="505" width="200" height="30" rx="8" fill="#e8eaee"/>
    <rect x="600" y="610" width="10" height="90" fill="#d4382e"/>
    <rect x="630" y="620" width="250" height="30" rx="8" fill="#8a909c"/>
    <rect x="630" y="665" width="180" height="30" rx="8" fill="#8a909c"/>
  </g>
</svg>
