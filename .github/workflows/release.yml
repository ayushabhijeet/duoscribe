name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS installers
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Built as two fully separate electron-builder processes rather than one
      # "--mac" invocation covering both arches: packaging both in a single
      # process reliably hit an EEXIST hardlinking icon.icns into the second
      # arch's Electron.app on GitHub-hosted mac runners (reproduced on both
      # macos-latest and macos-14; never reproduced locally, even with cold
      # caches, so it's runner-specific, not a real config/dependency bug).
      # -c.mac.target=dmg clears the config's arch array for this invocation
      # so --x64/--arm64 actually restrict to one architecture each.
      - name: Build unsigned mac installer (x64)
        run: npx electron-builder --mac --x64 -c.mac.target=dmg --publish=never

      - name: Build unsigned mac installer (arm64)
        run: npx electron-builder --mac --arm64 -c.mac.target=dmg --publish=never

      - name: Upload mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: |
            dist/Duoscribe-mac-x64.dmg
            dist/Duoscribe-mac-arm64.dmg
          if-no-files-found: error

  build-win:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned windows installer (x64 + arm64)
        run: npm run dist -- --win --publish=never

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: dist/Duoscribe-win-setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Download mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-installers
          path: dist

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: win-installer
          path: dist

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/Duoscribe-mac-x64.dmg
            dist/Duoscribe-mac-arm64.dmg
            dist/Duoscribe-win-setup.exe
